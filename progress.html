<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ΣΥΝΑΨΗ: Η πρόοδός μου</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Commissioner:wght@500;600;700;800&family=Noto+Sans:wght@400;600;700&display=swap">
<style>
:root{
  --bg:#F7F6F0; --surface:#FFFFFF; --ink:#2B3722; --body:#30342A; --muted:#5E6253; --line:#E1E1D7;
  --header:#2B3722; --on-header:#FFFFFF; --header-muted:#D9C7AE; --gold:#C9AD8D; color-scheme:light;
  --accent:#4F6230; --accent-soft:#EEF0E2; --ok:#2F6B4F; --mid:#8A6A12; --low:#A63D1E;
  --display:"Commissioner","Noto Sans",system-ui,sans-serif; --text:"Noto Sans",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141810; --surface:#1E2317; --ink:#EEEDE4; --body:#DADBCD; --muted:#B5B6A6; --line:#353B2A;
  --accent:#9DB46F; --accent-soft:#283019; --ok:#7CC9A2; --mid:#E2C063; --low:#F09A7C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141810; --surface:#1E2317; --ink:#EEEDE4; --body:#DADBCD; --muted:#B5B6A6; --line:#353B2A;
  --accent:#9DB46F; --accent-soft:#283019; --ok:#7CC9A2; --mid:#E2C063; --low:#F09A7C; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--body);font:15px/1.5 var(--text)}
header{background:var(--header);color:var(--on-header);padding:calc(env(safe-area-inset-top,0px) + 18px) 16px 22px}
.wrap{max-width:560px;margin:0 auto}
header a{color:var(--header-muted);font:600 13px var(--text);text-decoration:none}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.th{font:600 13px var(--text);color:var(--on-header);background:transparent;border:1px solid rgba(255,255,255,.35);border-radius:99px;padding:7px 12px;cursor:pointer}
.th:focus-visible,header a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
header h1{font:800 28px/1.15 var(--display);margin:10px 0 4px}
header p{margin:0;color:var(--header-muted);font-size:14px}
main{padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 32px)}
.sum{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:4px;margin-bottom:16px}
.sum .k{font:700 12px var(--text);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sum .v{font:800 30px/1.1 var(--display);color:var(--ink);font-variant-numeric:tabular-nums}
.sum .s{font-size:13.5px;color:var(--muted)}
ol{list-style:none;margin:0;padding:0;display:grid;gap:8px}
li{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:start}
.n{font:800 15px var(--display);color:var(--accent);background:var(--accent-soft);border-radius:8px;min-width:34px;text-align:center;padding:5px 0;grid-row:span 2}
.t{font:700 15px/1.3 var(--display);color:var(--ink);margin:0}
.d{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:13.5px;color:var(--muted)}
.d b{font-variant-numeric:tabular-nums}
.g{font:800 14px var(--display);border-radius:99px;padding:3px 10px;border:1.5px solid currentColor}
.g.ok{color:var(--ok)} .g.mid{color:var(--mid)} .g.low{color:var(--low)}
.d a{color:var(--accent);font-weight:700}
li.none .t{color:var(--muted)}
.note{font-size:13px;color:var(--muted);margin:16px 2px 0}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="top"><a href="index.html">Πίσω στη διαδρομή</a><button type="button" id="theme" class="th"></button></div>
  <h1>Η πρόοδός μου</h1>
  <p>Ο βαθμός κατανόησης από το Σύντομο Τεστ κάθε μαθήματος.</p>
</div></header>
<main class="wrap">
  <div class="sum"><span class="k">Μέσος βαθμός κατανόησης</span><span class="v" id="avg">–</span><span class="s" id="avgs"></span></div>
  <ol id="list"></ol>
  <p class="note">Βαθμός κατανόησης είναι η πιο πρόσφατη προσπάθειά σου σε κάθε τεστ. Στόχος είναι το 10/10 και στην καλύτερη και στην τελευταία.</p>
</main>
<script>
(function(){
  var root = document.documentElement, KEY = 'synapsi-theme';
  try { var t0 = localStorage.getItem(KEY); if (t0) root.setAttribute('data-theme', t0); } catch(e){}
  function cur(){ return root.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); }
  var bt = document.getElementById('theme');
  function show(){ bt.textContent = cur() === 'dark' ? '☀ Φωτεινό' : '☾ Σκοτεινό'; }
  bt.onclick = function(){ var t = cur() === 'dark' ? 'light' : 'dark'; root.setAttribute('data-theme', t); try { localStorage.setItem(KEY, t); } catch(e){} show(); };
  show();
})();
(function(){
  var OPEN = 23;   // ανοιχτά μαθήματα 1..OPEN
  var L = [[1, "Η έννοια του προβλήματος"], [2, "Τι είναι αλγόριθμος"], [3, "Από την εκφώνηση στον αλγόριθμο"], [4, "Ανάλυση προβλημάτων"], [5, "Το πρόγραμμα και η σχεδίασή του"], [6, "Γλώσσες και προγραμματιστικά περιβάλλοντα"], [7, "Αλφάβητο, τύποι, σταθερές, μεταβλητές"], [8, "Τελεστές, συναρτήσεις, εκφράσεις"], [9, "Εκχώρηση, είσοδος, έξοδος, δομή προγράμματος"], [10, "Δομή επιλογής: ΑΝ … ΤΟΤΕ … ΑΛΛΙΩΣ"], [11, "Πολλαπλή επιλογή: ΑΛΛΙΩΣ_ΑΝ, εμφωλευμένα ΑΝ, ΕΠΙΛΕΞΕ"], [12, "Δομή επανάληψης: ΟΣΟ … ΕΠΑΝΑΛΑΒΕ"], [13, "Δομή επανάληψης: ΑΡΧΗ_ΕΠΑΝΑΛΗΨΗΣ … ΜΕΧΡΙΣ_ΟΤΟΥ"], [14, "Δομή επανάληψης: ΓΙΑ … ΑΠΟ … ΜΕΧΡΙ"], [15, "Λάθη και εκσφαλμάτωση"], [16, "Μετατροπές μεταξύ δομών επανάληψης"], [17, "Γενικές ασκήσεις έως την επανάληψη"], [18, "Διαίρει και βασίλευε"], [19, "Δομές δεδομένων και πίνακες"], [20, "Μονοδιάστατοι πίνακες"], [21, "Σειριακή αναζήτηση"], [22, "Δυαδική αναζήτηση"], [23, "Ταξινόμηση"], [24, "Πότε χρησιμοποιούμε πίνακες"], [25, "Δισδιάστατοι πίνακες"], [26, "Τυπικές επεξεργασίες πινάκων"], [27, "Στοίβα"], [28, "Ουρά"], [29, "Γενικές ασκήσεις με πίνακες"], [30, "Τμηματικός προγραμματισμός"], [31, "Συναρτήσεις"], [32, "Διαδικασίες και παράμετροι"], [33, "Εμβέλεια και εκσφαλμάτωση"], [34, "Γενικές ασκήσεις με υποπρογράμματα"], [35, "Μαύρο κουτί: έλεγχος με σενάρια"], [36, "Λίστες"], [37, "Δένδρα"], [38, "Γράφοι"], [39, "Αντικείμενα"], [40, "Κλάσεις"], [41, "Κληρονομικότητα και πολυμορφισμός"]];
  function fmt(x){ return (Math.round(x * 10) / 10).toFixed(1).replace('.', ','); }
  function load(n){ try { return JSON.parse(localStorage.getItem('synapsi.test.L' + n)) || null; } catch(e){ return null; } }
  var ol = document.getElementById('list'), firsts = [];
  L.forEach(function(x){
    var n = x[0], st = load(n), done = st ? st.attempts.filter(function(a){ return a.score != null; }) : [];
    var li = document.createElement('li'); if (!done.length) li.className = 'none';
    var shut = n > OPEN;
    var num = document.createElement('span'); num.className = 'n'; num.textContent = n; li.appendChild(num);
    var t = document.createElement('p'); t.className = 't'; t.textContent = x[1]; li.appendChild(t);
    var d = document.createElement('div'); d.className = 'd';
    var page = (n < 10 ? '0' : '') + n + '.html';
    if (done.length){
      var f = done[done.length - 1].score; firsts.push(f);
      var g = document.createElement('span'); g.className = 'g ' + (f >= 8 ? 'ok' : f >= 5 ? 'mid' : 'low'); g.textContent = fmt(f) + '/10'; d.appendChild(g);
      var best = Math.max.apply(null, done.map(function(a){ return a.score; }));
      var b = document.createElement('span'); b.innerHTML = 'Καλύτερη <b>' + fmt(best) + '</b>'; d.appendChild(b);
      var c = document.createElement('span'); c.textContent = 'Προσπάθειες ' + st.attempts.length; d.appendChild(c);
    } else {
      var e = document.createElement('span'); e.textContent = shut ? 'Ανοίγει σύντομα' : 'Δεν έχει γίνει τεστ'; d.appendChild(e);
    }
    if (!shut) { var a = document.createElement('a'); a.href = page + '#test-start'; a.textContent = done.length ? 'Νέα προσπάθεια' : 'Κάνε το τεστ'; d.appendChild(a); }
    li.appendChild(d); ol.appendChild(li);
  });
  if (firsts.length){
    document.getElementById('avg').textContent = fmt(firsts.reduce(function(s, x){ return s + x; }, 0) / firsts.length) + ' / 10';
    document.getElementById('avgs').textContent = 'Από ' + firsts.length + (firsts.length === 1 ? ' μάθημα.' : ' μαθήματα.');
  } else document.getElementById('avgs').textContent = 'Κάνε το πρώτο σου τεστ για να ξεκινήσει η πρόοδος.';
})();
</script>
</body>
</html>
