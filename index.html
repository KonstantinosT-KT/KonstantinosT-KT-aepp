<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ΣΥΝΑΨΗ Πληροφορική</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Commissioner:wght@500;600;700;800&family=Noto+Sans:wght@400;600;700&display=swap">
<style>
/* Layout: one mobile-first column (max 560px) — a path of lessons like stations on a route, olive sign colours from the ΣΥΝΑΨΗ storefront */
:root{
  --bg:#F7F6F0; --surface:#FFFFFF; --ink:#2B3722; --body:#30342A; --muted:#5E6253; --line:#E1E1D7;
  --header:#2B3722; --header-2:#3C4A30; --on-header:#FFFFFF; --header-muted:#D9C7AE; --gold:#C9AD8D;
  --accent:#4F6230; --accent-soft:#EEF0E2; --ring:#DCE2C6;
  --locked-bg:#EFEFE8; --locked-node:#E8E8E0; --locked-line:#CBCBBF; --locked-ink:#42463A;
  --sos-bg:#FDF1E7; --sos-line:#E8B48A; --sos-ink:#8A3F0B; --new:#B4530F; --scrim:rgba(30,34,24,.55);
  --display:"Commissioner","Noto Sans",system-ui,sans-serif;
  --text:"Noto Sans",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141810; --surface:#1E2317; --ink:#EEEDE4; --body:#DADBCD; --muted:#B5B6A6; --line:#353B2A;
  --header:#2B3722; --header-2:#3C4A30; --on-header:#FFFFFF; --header-muted:#D9C7AE; --gold:#C9AD8D;
  --accent:#647A3E; --accent-soft:#283019; --ring:#3E4A2C;
  --locked-bg:#191D13; --locked-node:#262B1D; --locked-line:#464C38; --locked-ink:#C5C6B6;
  --sos-bg:#33241A; --sos-line:#7A4F2E; --sos-ink:#F2B98A; --new:#C4621A; --scrim:rgba(0,0,0,.6);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141810; --surface:#1E2317; --ink:#EEEDE4; --body:#DADBCD; --muted:#B5B6A6; --line:#353B2A;
  --header:#2B3722; --header-2:#3C4A30; --on-header:#FFFFFF; --header-muted:#D9C7AE; --gold:#C9AD8D;
  --accent:#647A3E; --accent-soft:#283019; --ring:#3E4A2C;
  --locked-bg:#191D13; --locked-node:#262B1D; --locked-line:#464C38; --locked-ink:#C5C6B6;
  --sos-bg:#33241A; --sos-line:#7A4F2E; --sos-ink:#F2B98A; --new:#C4621A; --scrim:rgba(0,0,0,.6);
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--text);font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--header)}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.2;text-wrap:balance}
p{margin:0}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.top{background:var(--header);color:var(--on-header)}
.top .wrap{padding-block:16px 22px;display:flex;flex-direction:column;gap:16px}
.bar{display:flex;justify-content:space-between;align-items:center}
.ibtn{width:44px;height:44px;border-radius:12px;border:0;background:var(--header-2);color:var(--on-header);display:flex;align-items:center;justify-content:center;cursor:pointer}
.logo{width:220px;max-width:100%;height:auto;display:block}
.course{font:800 23px/1.2 var(--display);letter-spacing:-.01em}
.teacher-card{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:var(--header-2)}
.av{flex:none;width:40px;height:40px;border-radius:50%;background:var(--gold);color:#2B3722;display:flex;align-items:center;justify-content:center;font:800 14px var(--display)}
.teacher-card b{display:block;font:700 14px/1.3 var(--display)}
.teacher-card small{display:block;font-size:12px;line-height:1.4;color:var(--header-muted)}
.intro{color:#EFE7DA;font-size:15px}
.prog{display:flex;flex-direction:column;gap:8px}
.prog-row{display:flex;justify-content:space-between;font:600 13px var(--display);font-variant-numeric:tabular-nums}
.prog-row span:last-child{color:var(--header-muted)}
.track{height:8px;border-radius:4px;background:var(--header-2)}
.track i{display:block;height:8px;border-radius:4px;background:var(--gold)}

/* path */
main{padding-block:8px 8px}
.group{margin-top:22px}
.group-h{display:flex;flex-direction:column;gap:2px;margin:0 0 12px 50px}
.group-h small{font:700 11.5px var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.group-h h2{font-size:17px}
.st{display:flex;gap:14px;text-decoration:none;color:var(--ink)}
.rail{display:flex;flex-direction:column;align-items:center;width:36px;flex:none}
.node{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:800 13px var(--display);font-variant-numeric:tabular-nums}
.line{width:3px;flex:1;min-height:14px}
.card{flex:1;min-width:0;margin-bottom:12px;padding:12px 14px;border-radius:14px;display:flex;flex-direction:column;gap:2px}
.card .n{font:600 12px var(--display);color:var(--muted)}
.card .t{font:700 15.5px/1.3 var(--display)}
.st.open .node{background:var(--ink);color:var(--bg)}
.st.open .line{background:var(--ink)}
.st.open .card{background:var(--surface);border:1px solid var(--line)}
.st.new .node{background:var(--accent);color:#fff;box-shadow:0 0 0 5px var(--ring)}
.st.new .card{border:2px solid var(--accent)}
.st.locked .node{background:var(--locked-node);border:1.5px solid var(--locked-line);color:var(--muted)}
.st.locked .line,.st.open.last-open .line{background:var(--locked-line)}
.st.locked .card{background:var(--locked-bg);border:1px solid transparent}
.st.locked .t{color:var(--locked-ink)}
.st.test .node{width:36px;height:36px;border-radius:10px;background:var(--surface);border:2px dashed var(--accent);color:var(--accent)}
.st.test .line{background:var(--locked-line)}
.st.test .card{background:transparent;border:2px dashed var(--accent)}
.st.test .n{display:flex;align-items:center;gap:6px;color:var(--accent);font:800 11px var(--display);letter-spacing:.08em}
.st.test .t{color:var(--ink)}
.st.final .node{border-radius:10px;background:var(--accent);color:#fff;box-shadow:4px 4px 0 -2px var(--bg),4px 4px 0 0 var(--accent),8px 8px 0 -2px var(--bg),8px 8px 0 0 var(--accent)}
.st.final .card{background:var(--accent-soft);border:2px dashed var(--accent);gap:6px;margin:0 10px 22px 0;box-shadow:5px 5px 0 -2px var(--bg),5px 5px 0 0 var(--accent),10px 10px 0 -2px var(--bg),10px 10px 0 0 var(--accent)}
.st.final .n{display:flex;align-items:center;gap:6px;color:var(--accent);font:800 11px var(--display);letter-spacing:.08em}
.st.final .t{font-size:17.5px;color:var(--ink)}
.st.final .d{font-size:13.5px;line-height:1.45;color:var(--muted)}
.st.final .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.st.final .tags span{font:700 11.5px var(--display);padding:4px 9px;border-radius:999px;background:var(--surface);color:var(--accent);border:1px solid var(--accent)}
.badge{align-self:flex-start;font:800 10.5px var(--display);letter-spacing:.08em;padding:3px 8px;border-radius:6px;background:var(--new);color:#fff;margin-bottom:2px}
.badge.soon{background:var(--accent-soft);color:var(--accent)}
.st.open:hover .card{border-color:var(--accent)}

/* panels */
.panel{margin:20px 0;padding:18px;border-radius:16px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.panel h3{font-size:17px}
.panel p{color:var(--muted);font-size:14.5px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 16px;border-radius:14px;border:0;background:var(--accent);color:#fff;font:700 15.5px var(--display);text-decoration:none;cursor:pointer;text-align:center}
.btn.ghost{background:transparent;border:1.5px solid var(--ink);color:var(--ink)}
.btn.gold{background:var(--gold);color:#2B3722}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.foot{border-top:1px solid var(--line);margin-top:8px}
.foot .wrap{padding-block:18px 28px;display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}
.foot b{font-weight:700}
.beta{display:inline-block;font:800 10.5px var(--display);letter-spacing:.08em;padding:3px 8px;border-radius:6px;background:var(--new);color:#fff;width:max-content}

/* subpages */
.sub-top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.sub-top .wrap{padding-block:12px;display:flex;align-items:center;gap:12px}
.sub-top .ibtn{background:var(--locked-bg);color:var(--ink)}
.sub-top h1{font-size:18px}
.page{padding-block:20px 32px;display:flex;flex-direction:column;gap:16px}
.hero-box{padding:20px;border-radius:18px;background:var(--header);color:#fff;display:flex;flex-direction:column;gap:8px}
.hero-box h2{font-size:23px}
.hero-box p{color:#EFE7DA}
.item{padding:16px;border-radius:14px;background:var(--surface);border:1px solid var(--line);display:flex;gap:14px;align-items:flex-start}
.item .k{flex:none;width:40px;height:40px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font:800 15px var(--display)}
.item b{display:block;font:700 15.5px/1.3 var(--display);margin-bottom:3px}
.item span{font-size:14px;color:var(--muted)}
.opt{padding:16px;border-radius:14px;display:flex;flex-direction:column;gap:6px}
.opt.light{background:var(--surface);border:1px solid var(--line)}
.opt.dark{background:var(--header);color:#fff}
.opt.dark p{color:#EFE7DA}
.opt-h{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.opt-h b{font:800 16px var(--display)}
.chip{font:700 11px var(--display);letter-spacing:.05em;padding:4px 8px;border-radius:6px;background:var(--accent-soft);color:var(--accent)}
.opt.dark .chip{background:var(--gold);color:#2B3722}
.note{padding:12px 14px;border-radius:12px;background:var(--locked-bg);color:var(--locked-ink);font-size:13.5px}
.photo{width:100%;max-width:100%;aspect-ratio:4/3;object-fit:cover;object-position:center 40%;border-radius:16px;display:block}
.team{display:flex;flex-direction:column;gap:10px}
.person{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.person .av{width:52px;height:52px;background:var(--header);color:var(--gold);font-size:16px}
.person b{display:block;font:700 16px var(--display)}
.person span{font-size:14px;color:var(--muted)}
.contact{display:flex;flex-direction:column;gap:10px}
.crow{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.crow svg{flex:none;color:var(--accent)}
.crow .v{flex:1;min-width:0;font-weight:600;user-select:all;overflow-wrap:anywhere}
.mini{min-height:36px;padding:0 12px;border-radius:10px;border:1.5px solid var(--accent);background:transparent;color:var(--accent);font:700 13px var(--display);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.seg button{min-height:80px;padding:12px;border-radius:14px;border:1px solid var(--locked-line);background:var(--surface);text-align:left;display:flex;flex-direction:column;gap:4px;cursor:pointer}
.seg button[aria-pressed="true"]{border:2px solid var(--accent);background:var(--accent-soft)}
.seg b{font:700 15px var(--display)}
.seg small{font-size:12px;color:var(--muted)}
fieldset{border:1px solid var(--line);border-radius:16px;padding:16px;margin:0;display:flex;flex-direction:column;gap:12px;background:var(--surface)}
legend{font:700 14px var(--display);padding:0 6px}
label{font-size:14px;font-weight:600;display:flex;flex-direction:column;gap:6px}
input,select,textarea{min-height:44px;padding:0 12px;border-radius:10px;border:1px solid var(--locked-line);background:var(--bg);color:var(--ink);font:15px var(--text)}
textarea{padding:10px 12px;resize:none}
.soon-box{padding:18px;border-radius:16px;border:1.5px dashed var(--locked-line);display:flex;flex-direction:column;gap:10px}
.soon-box ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;color:var(--body)}
.preview{display:flex;flex-direction:column;gap:8px;opacity:.6;pointer-events:none}
.pv{padding:12px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.pv .r{display:flex;justify-content:space-between;font-weight:700;font-size:14px}
.pv .tr{height:7px;border-radius:4px;background:var(--locked-node)}
.pv .tr i{display:block;height:7px;border-radius:4px;background:var(--accent)}


/* demos */
.soon-head{display:flex;flex-direction:column;gap:6px}
.soon-head h2{font-size:21px}
.soon-head p{color:var(--muted);font-size:14.5px}
.demo{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:18px;border:1.5px dashed var(--locked-line);background:var(--bg)}
.demo-note{margin-top:-8px;font-size:12px;color:var(--muted);text-align:center}
.pv{padding:12px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:6px;min-width:0}
.pv .r{display:flex;justify-content:space-between;gap:8px;font:700 14px/1.3 var(--display)}
.pv small,.stu small{font-size:12.5px;color:var(--muted)}
.tr{display:block;height:7px;border-radius:4px;background:var(--locked-node)}
.tr i{display:block;height:7px;border-radius:4px;background:var(--accent)}
.tr i.good{background:var(--ink)} .tr i.low{background:#D98A47} .tr i.past{background:var(--locked-line)}
.lv{font:700 13px var(--display)} .lv.good{color:#3E6B26} .lv.ok{color:var(--accent)} .lv.low{color:var(--sos-ink)}
:root[data-theme="dark"] .lv.good{color:#9CC27A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .lv.good{color:#9CC27A}}
.est{padding:18px;border-radius:16px;background:var(--header);color:#fff;display:flex;flex-direction:column;gap:8px}
.est small{color:var(--header-muted);font-size:12.5px}
.est div:not(.track){display:flex;align-items:baseline;gap:10px}
.est b{font:800 40px/1 var(--display);letter-spacing:-1px}
.est span{font:700 15px var(--display);color:var(--gold)}
.nextstep{padding:14px;border-radius:12px;background:var(--sos-bg);border:1.5px solid var(--sos-line);display:flex;flex-direction:column;gap:4px;color:var(--ink)}
.nextstep small{font:800 12px var(--display);letter-spacing:.06em;color:var(--sos-ink)}
.r-h{display:flex;align-items:center;gap:8px;margin-top:4px;color:var(--ink)} .r-h b{font:700 14px var(--display)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pv.lockd{background:var(--locked-bg);border-color:transparent;font:700 13.5px var(--display);color:var(--locked-ink);min-height:70px;justify-content:space-between}
.pv.lockd .tr{width:60%}
.pv.warn{background:var(--sos-bg);border-color:var(--sos-line)} .pv.warn .big,.pv.warn small{color:var(--sos-ink)}
.big{font:800 22px var(--display)}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:13.5px} .kv span{color:var(--muted)}
.fake-in{display:block;min-height:40px;padding:9px 12px;border-radius:9px;border:1px solid var(--locked-line);background:var(--bg);font-size:14px;font-weight:600;color:var(--ink)}
.fake-in.tall{min-height:64px;font-weight:400;line-height:1.5}
.fake-btn{display:flex;align-items:center;justify-content:center;min-height:40px;border-radius:10px;border:1.5px dashed var(--accent);color:var(--accent);font:700 13.5px var(--display)}
.fake-btn.solid{border-style:solid;background:var(--accent);color:#fff}
.btn[aria-disabled="true"]{cursor:default}
.tbh{display:flex;align-items:center;gap:10px;padding:12px;border-radius:14px;background:var(--header);color:#fff} .tbh b{font:700 15px var(--display)}
.tabs{display:flex;gap:8px}
.tab{min-height:38px;min-width:52px;padding:0 14px;border-radius:19px;border:1px solid var(--line);background:var(--surface);font:700 14px var(--display);cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.tab[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#2B3722}
.tab.add{border-style:dashed;color:var(--muted);cursor:default}
.code{font:800 14px var(--display);letter-spacing:.08em;color:var(--accent)}
.stu{position:relative;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);text-decoration:none;color:var(--ink)}
.stu:hover{border-color:var(--accent)}
.stu svg{flex:none;color:var(--muted)}
.stu-b{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.stu-b .r{display:flex;justify-content:space-between;gap:8px;font:700 14.5px var(--display)}
.av.sm{width:34px;height:34px;font-size:12px;background:var(--accent-soft);color:var(--accent)}
.hint{position:absolute;top:-10px;right:12px;font:800 10.5px var(--display);letter-spacing:.04em;padding:3px 8px;border-radius:6px;background:var(--new);color:#fff}
.stu:first-of-type{margin-top:8px}
.where{padding:12px 14px;border-radius:12px;background:var(--header);color:#fff;display:flex;flex-direction:column;gap:3px}
.where small{font:700 11.5px var(--display);letter-spacing:.08em;color:var(--gold)} .where b{font:700 14.5px/1.4 var(--display)}
.log{display:flex;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px} .log:last-child{border-bottom:0}
.log b{flex:none;width:44px;color:var(--accent);font:800 13px var(--display)} .log span{display:flex;flex-direction:column;gap:2px}
.cmp{display:flex;align-items:center;gap:8px;font:700 13px var(--display)} .cmp span:first-child{width:46px} .cmp .tr{flex:1}
.invite{flex-direction:row;align-items:center;gap:12px;background:var(--accent-soft);border-color:transparent} .invite b{display:block;font:700 14px var(--display)}
.invite small{font:700 11.5px var(--display);letter-spacing:.06em;color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px} .chips .chip{background:var(--locked-bg);color:var(--locked-ink)} .chips .chip.on{background:var(--accent);color:#fff}
.dl .dh{margin-bottom:2px}


/* teacher sales page */
.wl{padding:20px 16px;border-radius:20px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.eyebrow{font:700 11.5px var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.wl h2{font-size:26px;letter-spacing:-.01em}
.wl p{color:var(--body);font-size:15px}
.phones{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:4px}
.phones figure{margin:0;display:flex;flex-direction:column;gap:6px;align-items:stretch}
figcaption{text-align:center;font:700 13px var(--display);color:var(--muted)}
.ph{border-radius:20px;overflow:hidden;border:5px solid var(--ink);background:#F7F6F0;box-shadow:0 6px 20px rgba(20,24,16,.12)}
.ph-top{background:var(--pb);color:#fff;padding:10px 9px 12px;display:flex;flex-direction:column;gap:7px;transition:background .25s}
.ph-logo{display:flex;align-items:center;gap:6px;min-height:28px}
.mono{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font:800 12px var(--display)}
.mono-t{font:700 9.5px/1.15 var(--display)}
.ph-course{font:800 12px/1.2 var(--display)}
.ph-t{display:flex;gap:6px;align-items:center;background:var(--pb2);border-radius:8px;padding:5px}
.ph-av{flex:none;width:20px;height:20px;border-radius:50%;background:var(--pa);color:var(--pb);font:800 8px var(--display);display:flex;align-items:center;justify-content:center}
.ph-t b{display:block;font:700 8.5px/1.2 var(--display)} .ph-t small{display:block;font-size:7px;line-height:1.25;opacity:.8}

function home(){
  const openCount = LESSONS.filter(l=>isOpen(l.n)).length, pct = Math.round(openCount/LESSONS.length*100);
  let path='';
  for(const g of GROUPS){
    const ls = LESSONS.filter(l=>l.n>=g.from && l.n<=g.to);
    const items = [];
    ls.forEach(l=>{ items.push({kind:'lesson', l}); if(TEST_AFTER[l.n]) items.push({kind:'test', n:l.n}); });
    path += `<section class="group"><div class="group-h"><small>${esc(g.kicker)}</small><h2>${esc(g.title)}</h2></div>`;
    items.forEach((it,i)=>{
      const end = (i===items.length-1) ? '' : '<span class="line"></span>';
      if(it.kind==='test'){
        path += `<a href="#" data-testsoon="${it.n}" class="st test"><span class="rail"><span class="node">${I.clip}</span>${end}</span>
        <span class="card"><span class="n">ΜΑΘΗΜΑ-ΔΙΑΓΩΝΙΣΜΑ · ${I.lock}</span><span class="t">Διαγώνισμα: μαθήματα ${TEST_AFTER[it.n]}</span></span></a>`;
        return;
      }
      const l = it.l;
      const open=isOpen(l.n), nw=open&&NEW_LESSONS.includes(l.n);
      const cls = open ? ('open'+(nw?' new':'')+(l.n===OPEN_UP_TO?' last-open':'')) : 'locked';
      const tag = open ? `a href="${String(l.n).padStart(2,'0')}.html"` : `a href="#" data-locked="${l.n}"`;
      path += `<${tag} class="st ${cls}"><span class="rail"><span class="node">${open?l.n:I.lock}</span>${end}</span>
        <span class="card">${nw?'<span class="badge">ΝΕΑ</span>':''}<span class="n">ΜΑΘΗΜΑ ${l.n}</span><span class="t">${esc(l.title)}</span></span></a>`;
    });
    path += `</section>`;
  }
  path += `<section class="group"><a href="#" data-soon="final" class="st final"><span class="rail"><span class="node">${I.stack}</span></span>
    <span class="card"><span class="n">ΤΕΛΙΚΟ ΜΑΘΗΜΑ-ΔΙΑΓΩΝΙΣΜΑ · ${I.lock}</span><span class="t">Θέματα Πανελλαδικών &amp; επαναληπτικά</span>
    <span class="d">Θέματα Πανελλαδικών προηγούμενων ετών και επαναληπτικά διαγωνίσματα σε όλη την ύλη, με αναλυτική επεξήγηση κάθε λύσης.</span>
    <span class="tags"><span>Πανελλαδικές</span><span>Επαναληπτικά</span><span>Λύσεις με επεξήγηση</span></span></span></a></section>`;
  const dark = curTheme()==='dark';
  return `<header class="top"><div class="wrap">
    <div class="bar"><button class="ibtn" data-act="menu" aria-label="Μενού">${I.menu}</button>
      <button class="ibtn" data-act="theme" aria-label="${dark?'Φωτεινό θέμα':'Σκοτεινό θέμα'}">${dark?I.sun:I.moon}</button></div>
    <img class="logo" src="logo.png" alt="ΣΥΝΑΨΗ εκπαιδευτική ομάδα">
    <div class="course">Πληροφορική Γ' Λυκείου</div>
    <div class="teacher-card"><span class="av">ΚΘ</span><span><b>Καθηγητής: Κωνσταντίνος Θεοφίλου</b><small>Συγγραφή &amp; επιστημονική επιμέλεια υλικού: Κωνσταντίνος Θεοφίλου, MSc in ICT</small></span></div>
    <p class="intro">Η διαδρομή σου μέχρι τις Πανελλαδικές. Κάθε νέο μάθημα ανοίγει μόλις το δουλέψουμε στην τάξη.</p>
    <div class="prog"><div class="prog-row"><span>${openCount} από ${LESSONS.length} μαθήματα ανοιχτά</span><span>${pct}%</span></div><div class="track"><i style="width:${pct}%"></i></div></div>
  </div></header>
  <main class="wrap">${path}
    <div class="panel"><h3>Θέλεις επιπλέον καθοδήγηση;</h3><p>Δωρεάν δοκιμαστικό μάθημα σε μικρό τμήμα, διά ζώσης στον χώρο μας στην Πυλαία ή online από το σπίτι σου.</p>
      <a class="btn" href="#guidance">Θέλω να μάθω περισσότερα</a>
      <button class="btn ghost" data-act="share">${I.share} Στείλ' το σε φίλο</button></div>
  </main>${footer()}`;
}

/* ---------- δρομολόγηση ---------- */
const ROUTES={'':home,guidance,about,teacher,progress,'teacher-board':teacherBoard,'student-demo':studentDemo,join};
function render(){
  const h=location.hash.replace('#','');
  const app=document.getElementById('app');
  app.innerHTML=(ROUTES[h]||home)();
}
function layer(html){ document.getElementById('layer').innerHTML=html; }
function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2200); }
function copy(text, ok){ const done=()=>toast(ok||'Αντιγράφηκε');
  try{ navigator.clipboard.writeText(text).then(done,()=>toast(text)); }catch(e){ toast(text); } }

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act],[data-locked],[data-soon],[data-copy],[data-mode],[data-cls],[data-brand],[data-test],[data-testsoon]'); if(!el) return;
  if(el.dataset.cls){ cls=+el.dataset.cls; render(); return; }
  if(el.dataset.test){ testLvl=+el.dataset.test; const y=scrollY; render(); scrollTo(0,y); return; }
  if(el.dataset.brand){ brand=+el.dataset.brand; const y=scrollY; render(); scrollTo(0,y); return; }
  if(el.dataset.locked){ e.preventDefault(); layer(lockedSheet(+el.dataset.locked)); return; }
  if(el.dataset.testsoon){ e.preventDefault(); layer(testSheet(+el.dataset.testsoon)); return; }
  if(el.dataset.soon){ e.preventDefault(); layer(finalSheet()); return; }
  if(el.dataset.copy){ copy(el.dataset.copy); return; }
  if(el.dataset.mode){ mode=el.dataset.mode; render(); return; }
  const a=el.dataset.act;
  if(a==='menu') layer(drawer());
  if(a==='report') layer(reportSheet());
  if(a==='close'){ layer(''); }
  if(a==='theme'){ setTheme(curTheme()==='dark'?'light':'dark'); if(document.querySelector('.drawer')) layer(drawer()); }
  if(a==='share'){ copy('Δες τις σημειώσεις Πληροφορικής της ΣΥΝΑΨΗΣ: '+SHARE_URL,'Ο σύνδεσμος αντιγράφηκε. Στείλ\' τον σε έναν φίλο!'); }
});
document.addEventListener('submit',e=>e.preventDefault());
document.addEventListener('keydown',e=>{ if(e.key==='Escape') layer(''); });
window.addEventListener('hashchange',()=>{ layer(''); render(); scrollTo(0,0); });
window.addEventListener('pageshow',()=>{ try{const t=localStorage.getItem('synapsi-theme'); if(t) document.documentElement.setAttribute('data-theme',t);}catch(e){} render(); });
window.addEventListener('storage',e=>{ if(e.key==='synapsi-theme'&&e.newValue){ document.documentElement.setAttribute('data-theme',e.newValue); render(); } });
render();
</script>
